<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FinSight — Know where your money goes</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="page-center">
    <div class="auth-card">
        <div class="auth-brand"><span class="brand-mark">Fin</span>Sight</div>
        <p class="auth-tagline">A plain ledger for your Needs, Wants and Savings.</p>

        <div id="banner" class="banner" hidden></div>

        <!-- Login form -->
        <form id="login-form" class="auth-form">
            <div class="field">
                <label for="login-email">Email</label>
                <input type="email" id="login-email" required autocomplete="email">
            </div>
            <div class="field">
                <label for="login-password">Password</label>
                <input type="password" id="login-password" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-primary" id="login-submit">Log in</button>
        </form>

        <!-- Register form -->
        <form id="register-form" class="auth-form" hidden>
            <div class="field">
                <label for="reg-name">Name</label>
                <input type="text" id="reg-name" required autocomplete="name">
            </div>
            <div class="field">
                <label for="reg-email">Email</label>
                <input type="email" id="reg-email" required autocomplete="email">
            </div>
            <div class="field">
                <label for="reg-password">Password</label>
                <input type="password" id="reg-password" required minlength="8" autocomplete="new-password">
                <span class="hint">At least 8 characters.</span>
            </div>
            <button type="submit" class="btn btn-primary" id="register-submit">Create account</button>
        </form>

        <p class="auth-switch">
            <span id="switch-to-register">New here? <button type="button" class="link-btn" id="show-register">Create an account</button></span>
            <span id="switch-to-login" hidden>Already have an account? <button type="button" class="link-btn" id="show-login">Log in</button></span>
        </p>
    </div>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
